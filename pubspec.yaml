name: norve
description: "NORVÉ — Elevate Your Everyday."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  cached_network_image: ^4.0.6
  file_picker: ^13.3.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  go_router: ^16.2.4
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.10.3
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/norve_app_icon.png
  adaptive_icon_background: '#24211E'
  adaptive_icon_foreground: assets/branding/norve_app_icon.png
  adaptive_icon_foreground_inset: 0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
          weight: 100
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay.ttf
          weight: 400
